<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live2D Agent Kit · 真实模型预览</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./styles.css"></head>
<body><header><div><small>LIVE2D AGENT KIT</small><h1 id="model-label">模型预览</h1></div><a id="download" download hidden>下载模型</a><span id="status" role="status">等待真实 Cubism Core 与模型加载</span></header>
<main><section class="viewer"><div id="stage" data-background="soft"><canvas id="model-canvas" aria-label="真实 Live2D 模型画布"></canvas><img id="reference" hidden alt="用户提供的静态参考图"><div id="load-error" hidden role="alert"></div></div><div class="toolbar"><button data-view="full" class="selected">全身</button><button data-view="portrait">半身</button><button data-view="face">面部</button><label>缩放 <input id="zoom" type="range" min="0.5" max="2.5" step="0.01" value="1"></label><button id="reference-toggle" hidden>显示静态参考</button><select id="background" aria-label="预览背景"><option value="soft">柔白</option><option value="dark">深色</option><option value="checker">透明格</option></select></div><p id="render-info">未加载时不显示替代动画。</p></section>
<aside><fieldset id="controls" disabled><div class="toolbar"><button id="reset-all">恢复默认</button><label><input id="auto-play" type="checkbox"> 自动待机</label><label><input id="pointer-follow" type="checkbox"> 鼠标视线</label></div><p class="muted">自动动作依赖模型已有绑定。此页仅模拟输入，不连接 VTS、摄像头或麦克风。</p>
<h2>跟踪输入模拟</h2><div class="presets"><button data-profile="all">综合演示</button><button data-profile="face">转头与视线</button><button data-profile="blink">独立眨眼</button><button data-profile="talk">说话与表情</button><button data-profile="body">半身联动</button></div><p id="capture-status" role="status">选择模拟输入或手动调节</p><div class="toolbar"><button id="capture-pause" disabled>暂停</button><button id="capture-stop" disabled>停止并恢复</button><button id="capture-calibrate" disabled>当前角度设为正位</button></div><label class="range">时间轴 <output id="capture-time-value">0.0 / 24 秒</output><input id="capture-time" type="range" min="0" max="24" step="0.05" value="0" disabled></label><p class="muted">拖动时间轴会暂停动作与物理，保留当前帧。</p><label class="range">速度<input id="capture-speed" type="range" min="0.25" max="2" step="0.25" value="1"></label><label class="range">幅度<input id="capture-strength" type="range" min="0.2" max="1.5" step="0.05" value="1"></label><label class="range">平滑<input id="capture-smoothing" type="range" min="0" max="1" step="0.05" value="0.3"></label><div class="toolbar"><label><input id="face-visible" type="checkbox" checked>面部信号有效</label><label><input id="body-visible" type="checkbox" checked>身体信号有效</label></div><details><summary>手动 VTS 风格输入</summary><div id="capture-inputs"></div></details><details open><summary>实际输入 → 模型参数</summary><div id="capture-monitor"></div></details><p id="capability-note" class="muted"></p><h2>实际模型参数 <span id="parameter-count"></span></h2><p class="muted">滑块读取 Core 中的范围与默认值；存在参数不代表绑定了可见图形。拖动会接管模拟。</p><div id="parameters"></div><div id="expressions"></div><div id="motions"></div></fieldset></aside></main><footer>This project is not affiliated with Live2D Inc. · <a href="./README.md">预览说明</a></footer><script type="module" src="./app.js"></script></body></html>
